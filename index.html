<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aidan Webb</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 40%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 60%, rgba(236, 72, 153, 0.10) 0%, transparent 60%);
      pointer-events: none;
    }

    .content {
      position: relative;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 30%, #a5b4fc 70%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .tagline {
      margin-top: 1.25rem;
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: #94a3b8;
      letter-spacing: 0.02em;
    }

    .tagline em {
      color: #a5b4fc;
      font-style: normal;
    }

    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #f472b6;
      border-radius: 50%;
      margin: 0 0.4rem;
      vertical-align: middle;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    .btn {
      display: inline-block;
      margin-top: 2.5rem;
      padding: 0.85rem 2rem;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 9999px;
      letter-spacing: 0.01em;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 24px rgba(99,102,241,0.35);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(99,102,241,0.5);
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <h1>Aidan</h1>
    <p class="tagline">
      I lied. This is my first rodeo...
    </p>
    <a class="btn" href="loves.html">Click here to see how much...</a>
  </div>
</body>
</html>
